<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chise Ishii | Art Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Petit+Formal+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
.gallery-footer {
  display: flex;
  flex-direction: row;
  justify-content: flex-start;
  align-items: center;
  gap: 16px;
  width: 100%;
  box-sizing: border-box;
  margin-top: 20px;
  padding: 12px 24px;
  border-top: 1px solid #ddd;
  color: #777;
  font-size: 12px;
  border-bottom: none;
border-top: none;
}

.gallery-footer .footer-info {
  display: flex;
  align-items: center;
  margin: 0;
}

.gallery-footer .footer-social {
  display: flex;
  align-items: center;
  margin: 0;
}

.gallery-footer .footer-social a {
  display: inline-flex;
  align-items: center;
  color: #777;
  font-size: 22px;
  line-height: 1;
  text-decoration: none;
}

.gallery-footer .footer-social a:hover {
  color: #a890d3;
  font-size: 20px;
}
</style>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/chiseishii.github.io/">Chise Ishii</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/chiseishii.github.io/">Home</a>
    </nav>
  </header>

  <main class="gallery-wrapper">
    <div class="page-content">
      <h1 class="gallery-heading">Welcome to my Gallery</h1>
      <section class="gallery" aria-label="Artwork gallery">
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="Poème de l'Extase, Op. 54 (Alexander Scriabin)">
            <img src="image/img1.jpg" alt="Artwork inspired by Scriabin's Poème de l'Extase">
          </button>
          <figcaption>Poème de l'Extase, Op. 54 (Alexander Scriabin)</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="Symphony No. 1, Op. 26, in E major (Alexander Scriabin)">
            <img src="image/img2.png" alt="Artwork inspired by Scriabin's Symphony No. 1">
          </button>
          <figcaption>Symphony No. 1, Op. 26, in E major (Alexander Scriabin)</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="Fantaisie brillante sur des motifs de l'opéra Faust, Op. 20 (Henryk Wieniawski)">
            <img src="image/img3.png" alt="Artwork inspired by Wieniawski's Fantaisie brillante sur des motifs de Faust">
          </button>
          <figcaption>Fantaisie brillante sur des motifs de l'opéra Faust, Op. 20 (Henryk Wieniawski)</figcaption>
        </figure>
                <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="Sinfonietta (Korngold)">
            <img src="image/img8.png" alt="Sinfonietta (Korngold)">
          </button>
          <figcaption>Sinfonietta (Korngold)</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="General Relativity">
            <img src="image/img5.jpg" alt="Artwork inspired by General Relativity">
          </button>
          <figcaption>General Relativity</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="Symphony No. 2 (Brahms)">
            <img src="image/img9.png" alt="Artwork inspired by Symphony No. 2 (Brahms)">
          </button>
          <figcaption>Symphony No. 2 (Brahms)</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="der Rosenkavalier act lll">
            <img src="image/img4.jpg" alt="Artwork inspired by der Rosenkavalier act lll">
          </button>
          <figcaption>der Rosenkavalier act lll</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="artwork-button" type="button" data-caption="Violin Concert no.2 (Prokofiev)">
            <img src="image/img6.jpg" alt="Artwork inspired by Violin Concert no.2 (Prokofiev)">
          </button>
          <figcaption>Violin Concert no.2 (Prokofiev)</figcaption>
        </figure>
      </section>
    </div>
  </main>

<footer class="gallery-footer">
  <div class="footer-info">
    <span>© <span id="year"></span> Chise Ishii</span>
  </div>
  <div class="footer-social">
    <a href="https://www.instagram.com/chise.gallery/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
      <i class="fa fa-instagram"></i>
    </a>
  </div>
</footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image preview">&times;</button>
    <img class="lightbox-image" id="lightbox-image" src="" alt="">
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script>
    (() => {
      const lightbox = document.getElementById("lightbox");
      const lightboxImage = document.getElementById("lightbox-image");
      const lightboxCaption = document.getElementById("lightbox-caption");
      const closeButton = document.querySelector(".lightbox-close");

      document.querySelectorAll(".artwork-button").forEach((button) => {
        button.addEventListener("click", () => {
          const image = button.querySelector("img");
          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;
          lightboxCaption.textContent = button.dataset.caption || image.alt;
          lightbox.classList.add("is-open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.classList.add("no-scroll");
        });
      });

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImage.src = "";
        document.body.classList.remove("no-scroll");
      }

      closeButton.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLightbox();
      });
    })();
  </script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
